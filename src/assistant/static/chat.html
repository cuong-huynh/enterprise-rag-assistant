<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enterprise RAG Assistant</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --user-bg: #1e3a5f;
      --rag: #22c55e;
      --data: #f59e0b;
      --hybrid: #a855f7;
      --danger: #ef4444;
      --ok: #22c55e;
      --radius: 10px;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    header p {
      margin: 0.15rem 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .health {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .health-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .health-dot.ok { background: var(--ok); }
    .health-dot.err { background: var(--danger); }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 1.25rem 0;
      min-height: 0;
    }

    @media (min-width: 768px) {
      main {
        grid-template-columns: 1fr 280px;
        gap: 1rem;
        max-width: 1100px;
      }
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-height: calc(100vh - 180px);
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .msg {
      max-width: 92%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      line-height: 1.5;
      font-size: 0.925rem;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid #2a5080;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .msg.system {
      align-self: center;
      max-width: 100%;
      background: var(--surface-2);
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    .msg.error {
      align-self: stretch;
      background: #3f1d1d;
      border-color: #7f1d1d;
      color: #fecaca;
    }

    .answer {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .meta {
      margin-top: 0.65rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.5rem;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge.rag { background: rgba(34, 197, 94, 0.2); color: var(--rag); }
    .badge.data { background: rgba(245, 158, 11, 0.2); color: var(--data); }
    .badge.hybrid { background: rgba(168, 85, 247, 0.2); color: var(--hybrid); }
    .badge.blocked { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .sources {
      width: 100%;
      margin-top: 0.25rem;
    }

    .sources span {
      display: inline-block;
      margin: 0.15rem 0.25rem 0.15rem 0;
      padding: 0.1rem 0.35rem;
      background: var(--surface-2);
      border-radius: 4px;
      font-size: 0.7rem;
    }

    .composer {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 0 1rem;
      border-top: 1px solid var(--border);
    }

    .composer input[type="text"] {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 0.925rem;
    }

    .composer input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      padding: 0.65rem 1rem;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    button.secondary {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    button.secondary:hover:not(:disabled) {
      background: var(--border);
    }

    aside {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding-bottom: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }

    .card h2 {
      margin: 0 0 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .upload-row {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    input[type="file"] {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.4;
      margin: 0;
    }

    .examples {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .examples button {
      text-align: left;
      padding: 0.5rem 0.65rem;
      font-size: 0.78rem;
      font-weight: 400;
      line-height: 1.35;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .examples button:hover:not(:disabled) {
      border-color: var(--accent);
      background: #1e2a3d;
    }

    .typing {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.25rem 0;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Enterprise Assistant</h1>
      <p>RAG documents + ERP numbers in one chat</p>
    </div>
    <div class="health" id="health" title="API health">
      <span class="health-dot" id="health-dot"></span>
      <span id="health-text">Checking…</span>
    </div>
  </header>

  <main>
    <section class="chat-panel">
      <div id="log" aria-live="polite"></div>
      <div id="typing" class="typing" hidden>Assistant is thinking…</div>
      <form class="composer" id="chat-form">
        <input
          id="question"
          type="text"
          placeholder="Ask about a procedure or sale orders…"
          autocomplete="off"
          required
        />
        <button type="submit" id="send-btn">Send</button>
      </form>
    </section>

    <aside>
      <div class="card">
        <h2>Ingest PDF</h2>
        <div class="upload-row">
          <input type="file" id="pdf-file" accept=".pdf,application/pdf" />
          <button type="button" id="ingest-btn" class="secondary">Upload &amp; index</button>
          <p class="hint">
            Sends <code>POST /ingest</code>. With Redis worker: status <em>queued</em>.
            Sync mode: embeds immediately.
          </p>
        </div>
      </div>

      <div class="card">
        <h2>Example questions</h2>
        <div class="examples" id="examples"></div>
      </div>
    </aside>
  </main>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("chat-form");
    const questionInput = document.getElementById("question");
    const sendBtn = document.getElementById("send-btn");
    const typingEl = document.getElementById("typing");
    const pdfInput = document.getElementById("pdf-file");
    const ingestBtn = document.getElementById("ingest-btn");
    const healthDot = document.getElementById("health-dot");
    const healthText = document.getElementById("health-text");

    const EXAMPLES = [
      { label: "RAG — three-way match", q: "What is required for a three-way match before releasing supplier payment?" },
      { label: "Data — sale orders", q: "How many confirmed sale orders are there?" },
      { label: "Hybrid — receipt + stock", q: "How do I process a receipt when quantity differs, and what is current stock?" },
    ];

    function scrollLog() {
      log.scrollTop = log.scrollHeight;
    }

    function appendMessage(kind, html) {
      const div = document.createElement("div");
      div.className = "msg " + kind;
      div.innerHTML = html;
      log.appendChild(div);
      scrollLog();
      return div;
    }

    function appendUser(text) {
      appendMessage("user", escapeHtml(text));
    }

    function appendSystem(text) {
      appendMessage("system", escapeHtml(text));
    }

    function appendError(text) {
      appendMessage("error", escapeHtml(text));
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function routeBadge(route) {
      const r = (route || "unknown").toLowerCase();
      const cls = ["rag", "data", "hybrid"].includes(r) ? r : "data";
      return `<span class="badge ${cls}">${escapeHtml(route)}</span>`;
    }

    function appendAssistant(data) {
      let html = `<div class="answer">${escapeHtml(data.answer)}</div>`;
      html += `<div class="meta">`;
      html += routeBadge(data.route);
      if (data.blocked) {
        html += `<span class="badge blocked">blocked</span>`;
      }
      if (data.reason) {
        html += `<span>${escapeHtml(data.reason)}</span>`;
      }
      if (data.tool_steps != null && data.tool_steps > 0) {
        html += `<span>tools: ${data.tool_steps}</span>`;
      }
      if (data.models_used && data.models_used.length) {
        html += `<span>models: ${escapeHtml(data.models_used.join(", "))}</span>`;
      }
      if (data.block_reason) {
        html += `<span>${escapeHtml(data.block_reason)}</span>`;
      }
      if (data.sources && data.sources.length) {
        html += `<div class="sources">Sources: `;
        html += data.sources.map((s) => `<span>${escapeHtml(s)}</span>`).join("");
        html += `</div>`;
      }
      html += `</div>`;
      appendMessage("bot", html);
    }

    async function parseError(res) {
      try {
        const body = await res.json();
        if (body.detail) {
          if (typeof body.detail === "string") return body.detail;
          return JSON.stringify(body.detail);
        }
        return res.statusText || "Request failed";
      } catch {
        return res.statusText || "Request failed";
      }
    }

    async function checkHealth() {
      try {
        const res = await fetch("/health");
        if (!res.ok) throw new Error("not ok");
        const data = await res.json();
        healthDot.className = "health-dot ok";
        healthText.textContent = `API ${data.status} · v${data.version || "?"}`;
      } catch {
        healthDot.className = "health-dot err";
        healthText.textContent = "API unreachable";
      }
    }

    async function sendQuestion(question) {
      const q = question.trim();
      if (!q) return;

      appendUser(q);
      sendBtn.disabled = true;
      typingEl.hidden = false;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q }),
        });
        if (!res.ok) {
          appendError(await parseError(res));
          return;
        }
        const data = await res.json();
        appendAssistant(data);
      } catch (err) {
        appendError("Network error: " + (err.message || err));
      } finally {
        sendBtn.disabled = false;
        typingEl.hidden = true;
        questionInput.focus();
      }
    }

    async function ingestPdf() {
      const file = pdfInput.files && pdfInput.files[0];
      if (!file) {
        appendSystem("Choose a PDF file first.");
        return;
      }
      if (!file.name.toLowerCase().endsWith(".pdf")) {
        appendSystem("Only PDF files are supported.");
        return;
      }

      ingestBtn.disabled = true;
      appendSystem(`Uploading ${file.name}…`);

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch("/ingest", { method: "POST", body: formData });
        if (!res.ok) {
          appendError(await parseError(res));
          return;
        }
        const data = await res.json();
        let msg = `Ingest ${data.file}: status=${data.status}`;
        if (data.num_chunks) msg += `, chunks=${data.num_chunks}`;
        if (data.job_id) msg += `, job_id=${data.job_id}`;
        if (data.status === "queued") {
          msg += ". Worker will embed in the background — you can chat meanwhile.";
        }
        appendSystem(msg);
        pdfInput.value = "";
      } catch (err) {
        appendError("Upload failed: " + (err.message || err));
      } finally {
        ingestBtn.disabled = false;
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = questionInput.value;
      questionInput.value = "";
      sendQuestion(q);
    });

    ingestBtn.addEventListener("click", () => ingestPdf());

    const examplesEl = document.getElementById("examples");
    EXAMPLES.forEach(({ label, q }) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = label;
      btn.title = q;
      btn.addEventListener("click", () => {
        questionInput.value = q;
        questionInput.focus();
      });
      examplesEl.appendChild(btn);
    });

    appendSystem("Welcome. Upload a PDF on the right, or ask a question below.");
    checkHealth();
    setInterval(checkHealth, 30000);
    questionInput.focus();
  </script>
</body>
</html>
