<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enterprise RAG Assistant</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; background: #f6f7f9; }
    body { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
    p.sub { color: #555; margin-top: 0; }
    #log { background: #fff; border: 1px solid #ddd; border-radius: 8px; min-height: 280px; padding: 1rem; overflow-y: auto; }
    .msg { margin: 0.75rem 0; }
    .user { color: #0b57d0; }
    .bot { white-space: pre-wrap; }
    .meta { font-size: 0.8rem; color: #666; margin-top: 0.25rem; }
    form { display: flex; gap: 0.5rem; margin-top: 1rem; }
    input[type="text"] { flex: 1; padding: 0.6rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 0.6rem 1rem; border: none; background: #0b57d0; color: #fff; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>
  <h1>Enterprise Assistant</h1>
  <p class="sub">Documents (RAG) and ERP numbers (structured query) in one chat.</p>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <input id="q" type="text" placeholder="Ask about a procedure or sale orders…" autocomplete="off" required />
    <button type="submit">Send</button>
  </form>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("q");

    function append(role, text, meta) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = (role === "user" ? "You: " : "Assistant: ") + text;
      if (meta) {
        const m = document.createElement("div");
        m.className = "meta";
        m.textContent = meta;
        div.appendChild(m);
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      append("user", question);
      input.value = "";
      const btn = form.querySelector("button");
      btn.disabled = true;
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        const meta = `route=${data.route} · ${data.reason}`;
        append("bot", data.answer, meta);
      } catch (err) {
        append("bot", "Request failed: " + err);
      } finally {
        btn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
