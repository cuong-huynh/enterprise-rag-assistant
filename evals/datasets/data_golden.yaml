  - id: d12
    question: What is the inventory quantity on hand?
    kind: data
    expected_model: stock.quant
    domain: []
    fields: ["product_id", "location_name", "quantity", "reserved_quantity"]
    limit: 100
    metric: sum_quantity

  - id: d13
    question: Doanh thu các đơn confirmed là bao nhiêu?
    kind: data
    expected_model: sale.order
    domain:
      - ["state", "in", ["sale", "done"]]
    fields: ["name", "state", "amount_total", "date_order"]
    limit: 100
