# P3 golden set — structured queries on mock Odoo SQLite.
# Ground truth = adapter.search_read with the domain/fields/limit below
# (same cap as the engine, max 100). Score is mock-safe: model + count/sum in the answer.

dataset: data_golden
version: 1

cases:
  # --- 15 metric / list questions ---
  - id: d01
    question: How many confirmed sale orders are there?
    kind: data
    expected_model: sale.order
    domain:
      - ["state", "in", ["sale", "done"]]
    fields: ["name", "state", "amount_total", "date_order"]
    limit: 100
    metric: count

  - id: d02
    question: What is the total amount of confirmed sale orders?
    kind: data
    expected_model: sale.order
    domain:
      - ["state", "in", ["sale", "done"]]
    fields: ["name", "state", "amount_total", "date_order"]
    limit: 100
    metric: sum_amount_total

  - id: d03
    question: How many sale orders are in state sale?
    kind: data
    expected_model: sale.order
    domain:
      - ["state", "in", ["sale", "done"]]
    fields: ["name", "state", "amount_total", "date_order"]
    limit: 100
    metric: count

  - id: d04
    question: How many orders are there?
    kind: data
    expected_model: sale.order
    domain: []
    fields: ["name", "state", "amount_total", "date_order"]
    limit: 100
    metric: count

  - id: d05
    question: Show stock quantities in the warehouse
    kind: data
    expected_model: stock.quant
    domain: []
    fields: ["product_id", "location_name", "quantity", "reserved_quantity"]
    limit: 100
    metric: sum_quantity

  - id: d06
    question: How many stock quant rows are in inventory?
    kind: data
    expected_model: stock.quant
    domain: []
    fields: ["product_id", "location_name", "quantity", "reserved_quantity"]
    limit: 100
    metric: count

  - id: d07
    question: How many products are in the catalog?
    kind: data
    expected_model: product.product
    domain: []
    fields: ["name", "default_code", "list_price"]
    limit: 30
    metric: count

  - id: d08
    question: List product SKUs
    kind: data
    expected_model: product.product
    domain: []
    fields: ["name", "default_code", "list_price"]
    limit: 30
    metric: count

  - id: d09
    question: How many customers and partners are there?
    kind: data
    expected_model: res.partner
    domain: []
    fields: ["name", "email", "is_company"]
    limit: 30
    metric: count

  - id: d10
    question: List vendor partners
    kind: data
    expected_model: res.partner
    domain: []
